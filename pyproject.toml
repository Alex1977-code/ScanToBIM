[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scantobim"
version = "3.4.0"
description = "Scan-to-BIM reconstruction: turn LiDAR point clouds and photos into clean-edged 3D models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex1977-code" }]
keywords = [
    "lidar", "point-cloud", "photogrammetry", "scan-to-bim",
    "3d-reconstruction", "mesh", "ransac", "bim",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "laspy>=2.5",
]

[project.optional-dependencies]
laz = ["lazrs>=0.5"]          # compressed .laz support for laspy
e57 = ["pye57>=0.4"]          # ASTM E57 scanner exchange format
photos = ["Pillow>=10"]       # photo projection texturing (reads the images)
viz = ["open3d>=0.18"]        # optional: Poisson fallback + interactive viewer
dev = ["pytest>=7", "lazrs>=0.5", "Pillow>=10", "pye57>=0.4"]

[project.scripts]
scantobim = "scantobim.cli:main"

[project.urls]
Homepage = "https://github.com/Alex1977-code/ScanToBIM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
