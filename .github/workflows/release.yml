name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v1.5.0)"
        required: true
        default: "v1.5.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .[laz,photos,e57] pyinstaller

      - name: Install CUDA backend (GPU mit CPU-Fallback)
        # Eine einzige Version: CuPy + CUDA-Laufzeit sind immer dabei;
        # ohne NVIDIA-Karte fällt jede GPU-Operation transparent auf die
        # CPU zurück. Die nvidia-Wheels liefern cudart + NVRTC mit — auf
        # dem Zielrechner genügt der normale Grafiktreiber.
        run: pip install cupy-cuda12x nvidia-cuda-runtime-cu12 nvidia-cuda-nvrtc-cu12

      - name: Run test suite
        run: |
          pip install pytest
          pytest -q

      - name: Build exe
        shell: bash
        run: |
          NVDIR=$(python -c "import nvidia, pathlib; print(pathlib.Path(list(nvidia.__path__)[0]).as_posix())")
          echo "CUDA-Runtime-Wheels: $NVDIR"
          # --hidden-import graphlib: Stdlib-Modul, das CuPy dynamisch lädt —
          # PyInstallers Scan übersieht es, ohne bricht der CuPy-Import im Exe.
          EXTRA="--collect-all cupy --collect-all cupyx --collect-all cupy_backends --collect-all fastrlock --hidden-import graphlib --add-data $NVDIR;nvidia"
          # Die CUDA-DLLs zusätzlich ins Paket-Stammverzeichnis legen:
          # PyInstaller registriert _MEIPASS selbst per add_dll_directory,
          # damit lösen CuPys pyd-Abhängigkeiten ohne jede Eigenlogik auf.
          for dll in "$NVDIR"/*/bin/*.dll; do
            echo "  bundle: $dll"
            EXTRA="$EXTRA --add-binary $dll;."
          done
          pyinstaller --onefile --console --name scantobim \
            --collect-all laspy --collect-all lazrs --collect-all pye57 \
            $EXTRA \
            packaging/windows/launcher.py

      - name: Smoke test the exe
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from synthetic import make_box_scan; from scantobim.io.writers import write_point_cloud; write_point_cloud(make_box_scan(density=500, noise=0.004), 'smoke.ply')"
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, "tests")
          import numpy as np
          import pye57
          from synthetic import make_box_scan
          cloud = make_box_scan(density=300, noise=0.004)
          rgb = np.random.default_rng(1).integers(40, 220, (len(cloud.points), 3))
          e57 = pye57.E57("smoke.e57", mode="w")
          e57.write_scan_raw({
              "cartesianX": cloud.points[:, 0],
              "cartesianY": cloud.points[:, 1],
              "cartesianZ": cloud.points[:, 2],
              "colorRed": rgb[:, 0].astype(np.uint8),
              "colorGreen": rgb[:, 1].astype(np.uint8),
              "colorBlue": rgb[:, 2].astype(np.uint8),
          })
          e57.close()
          PYEOF
          ./dist/scantobim.exe --version
          ./dist/scantobim.exe info smoke.ply
          ./dist/scantobim.exe info smoke.e57
          ./dist/scantobim.exe reconstruct smoke.e57 -o smoke_e57.html --texture --seed 1
          ./dist/scantobim.exe reconstruct smoke.ply -o smoke.glb --seed 1 --report smoke.json
          ./dist/scantobim.exe reconstruct smoke.ply -o smoke.stp --seed 1
          python - <<'EOF'
          import json
          report = json.load(open("smoke.json"))
          assert report["planes"] == 6, report["planes"]
          angles = report["plane_angles"]
          assert angles["other"] == 0, angles
          print("smoke test OK:", report["planes"], "planes,", angles)
          EOF

      - name: Verify CUDA chain inside the exe
        shell: bash
        # Führt die GPU-Diagnose IM fertigen Exe aus. Der Runner hat keine
        # NVIDIA-Karte — aber 'import cupy: OK' muss gelingen, sonst ist
        # das Paket kaputt und darf nicht veröffentlicht werden.
        run: |
          ./dist/scantobim.exe gpu -o .
          echo "================ gpu_diagnose.txt ================"
          cat gpu_diagnose.txt
          echo "=================================================="
          grep -q "import cupy: OK" gpu_diagnose.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-diagnose
          path: gpu_diagnose.txt

      - name: Package
        shell: bash
        run: |
          mkdir pkg
          cp dist/scantobim.exe pkg/
          cp packaging/windows/LIESMICH.txt pkg/
          cp LICENSE pkg/LICENSE.txt
          NAME="scantobim-windows-x64"
          cd pkg && 7z a "../$NAME.zip" . && cd ..
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          # Link-Kompatibilität: dieselbe Datei auch unter dem alten
          # GPU-Namen anbieten (beide latest-Links bleiben gültig).
          cp "$NAME.zip" "$NAME-gpu.zip"
          sha256sum "$NAME-gpu.zip" > "$NAME-gpu.zip.sha256"
          ls -la "$NAME"*.zip*

      - uses: actions/upload-artifact@v4
        with:
          name: scantobim-windows-x64
          path: scantobim-windows-x64*.zip*

      - name: Create GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="scantobim-windows-x64"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "ScanToBIM $TAG (Windows)" \
            --notes-file packaging/windows/release-notes.md \
            "$NAME.zip" "$NAME.zip.sha256" \
            "$NAME-gpu.zip" "$NAME-gpu.zip.sha256" \
          || gh release upload "$TAG" \
            "$NAME.zip" "$NAME.zip.sha256" \
            "$NAME-gpu.zip" "$NAME-gpu.zip.sha256" --clobber
